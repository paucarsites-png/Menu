<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash Point — Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #D81E27;
    --red-deep: #9C1319;
    --cream: #FBECD3;
    --cream-soft: #FFF7E8;
    --ink: #17223B;
    --orange: #F5A22E;
    --orange-deep: #D97F13;
    --green-ok: #2E8B57;
    --line: rgba(23,34,59,0.12);
    --shadow: 0 6px 0 rgba(23,34,59,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--red);
    background-image:
      radial-gradient(circle at 10% 8%, rgba(255,255,255,0.06) 0, transparent 40%),
      radial-gradient(circle at 90% 92%, rgba(0,0,0,0.12) 0, transparent 40%);
    font-family:'Nunito', sans-serif;
    color: var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background: var(--red);
    position:relative;
    padding-bottom: 110px;
    box-shadow: 0 0 60px rgba(0,0,0,0.35);
  }

  /* ---------- Header ---------- */
  header{
    padding: 22px 20px 14px;
    text-align:center;
  }
  .stars{
    letter-spacing: 10px;
    color: var(--cream);
    font-size: 13px;
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-bottom: 6px;
    opacity:0.9;
  }
  .stars span::before{content:"★";}
  h1.logo{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 42px;
    color: var(--cream);
    margin: 0;
    text-shadow: 0 3px 0 var(--red-deep);
    letter-spacing: 0.5px;
    transform: rotate(-1deg);
  }
  .tagline{
    font-family:'Nunito';
    font-weight:700;
    font-style: italic;
    color: rgba(255,247,232,0.85);
    font-size: 13px;
    margin-top: 4px;
  }

  /* ---------- Category tabs ---------- */
  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 6px 16px 16px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex: 0 0 auto;
    font-family:'Baloo 2';
    font-weight:700;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 999px;
    background: rgba(255,247,232,0.14);
    color: var(--cream);
    border: 2px solid rgba(255,247,232,0.35);
    cursor:pointer;
    white-space:nowrap;
    transition: all .15s ease;
  }
  .tab.active{
    background: var(--cream);
    color: var(--red-deep);
    border-color: var(--cream);
  }

  /* ---------- Category panel ---------- */
  .panel{
    background: var(--cream);
    margin: 0 12px 16px;
    border-radius: 20px;
    padding: 16px 14px 10px;
    display:none;
    border: 3px solid var(--cream-soft);
  }
  .panel.active{display:block;}
  .panel-title{
    font-family:'Baloo 2';
    font-weight:800;
    font-size: 22px;
    color: var(--red-deep);
    margin: 2px 4px 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }

  /* ---------- Product card ---------- */
  .card{
    background: var(--cream-soft);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
    display:flex;
    gap: 12px;
    align-items:flex-start;
  }
  .card-icon{
    flex: 0 0 56px;
    width:56px; height:56px;
    border-radius:14px;
    background: linear-gradient(160deg, var(--orange), var(--orange-deep));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 28px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.15);
  }
  .card-body{flex:1; min-width:0;}
  .card-name{
    font-family:'Baloo 2';
    font-weight:700;
    font-size: 16px;
    color: var(--ink);
    line-height:1.15;
    margin: 0 0 3px;
  }
  .card-desc{
    font-size: 12.5px;
    color: rgba(23,34,59,0.65);
    line-height:1.35;
    margin: 0 0 10px;
  }
  .card-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .price{
    font-family:'Baloo 2';
    font-weight:800;
    font-size: 15px;
    color: var(--red-deep);
  }
  .add-btn{
    font-family:'Baloo 2';
    font-weight:700;
    font-size: 13px;
    background: var(--red);
    color: var(--cream);
    border:none;
    border-radius: 999px;
    padding: 8px 16px;
    box-shadow: var(--shadow);
    cursor:pointer;
    transition: transform .08s ease;
  }
  .add-btn:active{transform: translateY(3px); box-shadow:none;}

  .stepper{
    display:flex;
    align-items:center;
    gap: 10px;
    background: var(--red);
    border-radius: 999px;
    padding: 4px 6px;
    box-shadow: var(--shadow);
  }
  .stepper button{
    width: 26px; height:26px;
    border-radius:50%;
    border:none;
    background: var(--cream);
    color: var(--red-deep);
    font-family:'Baloo 2';
    font-weight:800;
    font-size: 16px;
    line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .stepper .qty{
    font-family:'Baloo 2';
    font-weight:800;
    color: var(--cream);
    font-size: 14px;
    min-width: 16px;
    text-align:center;
  }

  .note{
    font-size: 11px;
    color: rgba(23,34,59,0.55);
    font-style: italic;
    margin: -6px 0 10px 4px;
  }

  /* ---------- Footer info ---------- */
  .info{
    margin: 4px 12px 0;
    background: var(--cream-soft);
    border-radius: 16px;
    padding: 14px 16px;
    text-align:center;
    font-size: 12.5px;
    color: var(--ink);
    line-height:1.6;
    font-weight: 700;
  }
  .info b{color: var(--red-deep);}

  /* ---------- Cart bar ---------- */
  .cart-bar{
    position: fixed;
    left: 50%;
    transform: translateX(-50%) translateY(140%);
    bottom: 14px;
    width: calc(100% - 32px);
    max-width: 428px;
    background: var(--ink);
    border-radius: 16px;
    padding: 12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    cursor:pointer;
    z-index: 40;
    transition: transform .25s ease;
  }
  .cart-bar.show{ transform: translateX(-50%) translateY(0); }
  .cart-bar-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cart-bubble{
    width:34px;height:34px;
    border-radius:50%;
    background: var(--orange);
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
  }
  .cart-count{
    font-family:'Baloo 2';
    font-weight:700;
    font-size:12px;
    color: rgba(255,247,232,0.75);
  }
  .cart-total{
    font-family:'Baloo 2';
    font-weight:800;
    font-size:16px;
    color: #fff;
  }
  .cart-cta{
    font-family:'Baloo 2';
    font-weight:700;
    font-size:13px;
    color: var(--red-deep);
    background: var(--cream);
    padding: 8px 14px;
    border-radius: 999px;
  }

  /* ---------- Cart drawer ---------- */
  .overlay{
    position: fixed;
    inset:0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
    display:none;
  }
  .overlay.show{display:block;}
  .drawer{
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 460px;
    max-height: 78vh;
    background: var(--cream);
    border-radius: 22px 22px 0 0;
    z-index: 51;
    display:flex;
    flex-direction:column;
    transition: transform .28s ease;
  }
  .drawer.show{ transform: translate(-50%, 0); }
  .drawer-handle{
    width: 40px; height:5px;
    background: var(--line);
    border-radius:99px;
    margin: 10px auto 4px;
  }
  .drawer-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 6px 18px 10px;
    border-bottom: 2px solid var(--line);
  }
  .drawer-header h2{
    font-family:'Baloo 2';
    font-size:20px;
    color: var(--red-deep);
    margin:0;
  }
  .drawer-close{
    background:none;border:none;
    font-size:20px;
    color: var(--ink);
    cursor:pointer;
  }
  .drawer-items{
    padding: 8px 18px;
    overflow-y:auto;
    flex:1;
  }
  .drawer-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .drawer-item-name{
    font-family:'Baloo 2';
    font-weight:700;
    font-size: 14px;
  }
  .drawer-item-sub{
    font-size: 11.5px;
    color: rgba(23,34,59,0.6);
  }
  .drawer-item-price{
    font-family:'Baloo 2';
    font-weight:800;
    color: var(--red-deep);
    font-size: 13px;
    white-space:nowrap;
  }
  .empty-cart{
    text-align:center;
    padding: 40px 20px;
    color: rgba(23,34,59,0.55);
    font-weight:700;
  }
  .drawer-footer{
    padding: 14px 18px 20px;
    border-top: 2px solid var(--line);
  }
  .drawer-total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 12px;
  }
  .drawer-total-row span:first-child{
    font-weight:800;
    font-family:'Baloo 2';
    color: var(--ink);
  }
  .drawer-total-row span:last-child{
    font-family:'Baloo 2';
    font-weight:800;
    font-size: 20px;
    color: var(--red-deep);
  }
  .checkout-btn{
    width:100%;
    padding: 14px;
    border:none;
    border-radius: 14px;
    background: var(--red);
    color: var(--cream);
    font-family:'Baloo 2';
    font-weight:800;
    font-size: 16px;
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .checkout-btn:active{transform: translateY(2px); box-shadow:none;}

  .toast{
    position: fixed;
    left:50%;
    top: 18px;
    transform: translate(-50%, -140%);
    background: var(--ink);
    color: var(--cream);
    font-family:'Baloo 2';
    font-weight:700;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    z-index: 60;
    transition: transform .25s ease;
    white-space:nowrap;
  }
  .toast.show{ transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="stars"><span></span><span></span><span></span></div>
    <h1 class="logo">Smash Point</h1>
    <div class="tagline">Hamburguesas smash, hot dogs y más — Av 24 con calle 13</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="panels"></main>

  <div class="info">
    📞 Pedidos para llevar: <b>0978650037</b><br>
    🕔 Lunes a domingo: <b>5:00 pm – 12:00 am</b><br>
    📍 <b>Av 24 con calle 13</b>
  </div>
</div>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-left">
    <div class="cart-bubble">🛒</div>
    <div>
      <div class="cart-count" id="cartCount">0 productos</div>
      <div class="cart-total" id="cartTotal">$0.00</div>
    </div>
  </div>
  <div class="cart-cta">Ver carrito</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <h2>Tu pedido</h2>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-footer">
    <div class="drawer-total-row">
      <span>Total</span>
      <span id="drawerTotal">$0.00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">Confirmar pedido</button>
  </div>
</div>

<div class="toast" id="toast">Agregado al carrito ✅</div>

<script>
const MENU = {
  hamburguesas: {
    label: "Hamburguesas",
    icon: "🍔",
    items: [
      { id:"h1", icon:"🍔", name:"La clásica smash", desc:"Pan de papa, carne 130g, queso cheddar, cebolla caramelizada, pepinillo, salsa de la casa.", price:4.00 },
      { id:"h2", icon:"🥓", name:"Bacon smash", desc:"Pan de papa, carne 130g, cheddar, bacon, lechuga, tomate, pepinillo.", price:5.50 },
      { id:"h3", icon:"🍍", name:"Tropical brutal", desc:"Pan de papa, carne 130g, cheddar, bacon, piña, salsa de la casa.", price:6.50 },
      { id:"h4", icon:"🧀", name:"Bacon jam supreme", desc:"Pan de papa, carne, cheddar, mermelada de bacon y pepinillos.", price:6.99 },
      { id:"h5", icon:"🍔", name:"Doble smash", desc:"Pan de papa, doble carne, doble cheddar, pepinillos y salsa de la casa.", price:7.50 },
    ]
  },
  hotdog: {
    label: "Hot dog",
    icon: "🌭",
    items: [
      { id:"d1", icon:"🌭", name:"Tropi fresh", desc:"Salchicha, papas fritas, cheddar y bacon crujiente.", price:3.99 },
      { id:"d2", icon:"🍍", name:"El fresco", desc:"Salchicha, pico de gallo, bacon salteado con piña y salsa de la casa.", price:5.00 },
      { id:"d3", icon:"🌶️", name:"Verano smash", desc:"Salchicha, carne asada, bacon crujiente, cheddar, salsa chipotle.", price:15.99, note:"Puedes agregar porción de papa por $1 en Extras." },
    ]
  },
  bebidas: {
    label: "Bebidas",
    icon: "🥤",
    items: [
      { id:"b1", icon:"🥤", name:"Batidos", desc:"Chocolate, fresa, oreo o durazno.", price:2.75 },
      { id:"b2", icon:"🥤", name:"Colas P", desc:"Sprite, Coca-Cola, Fanta o Inca.", price:0.75 },
      { id:"b3", icon:"💧", name:"Agua", desc:"Botella de agua.", price:0.75 },
      { id:"b4", icon:"🍵", name:"Té", desc:"Té de jamaica.", price:1.25 },
    ]
  },
  extras: {
    label: "Extras",
    icon: "🍟",
    items: [
      { id:"e1", icon:"🍟", name:"Papa bacon cheese", desc:"Porción de papas con bacon y queso cheddar.", price:3.99 },
      { id:"e2", icon:"🌭", name:"Chorizo power", desc:"Porción cargada con chorizo.", price:4.75 },
      { id:"e3", icon:"🍟", name:"Porción papa", desc:"Papas fritas clásicas.", price:1.00 },
      { id:"e4", icon:"🧀", name:"Queso cheddar", desc:"Extra de queso cheddar.", price:0.50 },
      { id:"e5", icon:"🥩", name:"Carne", desc:"Carne extra 130g.", price:1.50 },
      { id:"e6", icon:"🥓", name:"Tocino", desc:"Órdenes de 50 gr.", price:1.00 },
    ]
  }
};

const cart = {}; // id -> qty

function money(n){ return "$" + n.toFixed(2); }

function findItem(id){
  for(const cat of Object.values(MENU)){
    const found = cat.items.find(i => i.id === id);
    if(found) return found;
  }
}

function cartTotals(){
  let count = 0, total = 0;
  for(const id in cart){
    const qty = cart[id];
    if(qty > 0){
      count += qty;
      total += qty * findItem(id).price;
    }
  }
  return { count, total };
}

function setQty(id, qty){
  cart[id] = Math.max(0, qty);
  renderStepper(id);
  renderCartBar();
  if(document.getElementById('drawer').classList.contains('show')) renderDrawer();
}

function renderStepper(id){
  const el = document.getElementById('stepper-' + id);
  if(!el) return;
  const qty = cart[id] || 0;
  const item = findItem(id);
  if(qty === 0){
    el.innerHTML = `<button class="add-btn" onclick="addFirst('${id}')">Agregar</button>`;
  } else {
    el.innerHTML = `
      <div class="stepper">
        <button onclick="setQty('${id}', ${qty - 1})">−</button>
        <div class="qty">${qty}</div>
        <button onclick="setQty('${id}', ${qty + 1})">+</button>
      </div>`;
  }
}

function addFirst(id){
  setQty(id, 1);
  showToast(findItem(id).name + " agregado ✅");
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 1400);
}

function renderCartBar(){
  const { count, total } = cartTotals();
  const bar = document.getElementById('cartBar');
  document.getElementById('cartCount').textContent = count + (count === 1 ? " producto" : " productos");
  document.getElementById('cartTotal').textContent = money(total);
  bar.classList.toggle('show', count > 0);
}

function renderDrawer(){
  const container = document.getElementById('drawerItems');
  const { count, total } = cartTotals();
  if(count === 0){
    container.innerHTML = `<div class="empty-cart">Tu carrito está vacío.<br>Agrega algo delicioso 🍔</div>`;
  } else {
    container.innerHTML = Object.keys(cart)
      .filter(id => cart[id] > 0)
      .map(id => {
        const item = findItem(id);
        const qty = cart[id];
        return `
          <div class="drawer-item">
            <div>
              <div class="drawer-item-name">${item.icon} ${item.name}</div>
              <div class="drawer-item-sub">${qty} × ${money(item.price)}</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <div class="stepper">
                <button onclick="setQty('${id}', ${qty - 1})">−</button>
                <div class="qty">${qty}</div>
                <button onclick="setQty('${id}', ${qty + 1})">+</button>
              </div>
              <div class="drawer-item-price">${money(item.price * qty)}</div>
            </div>
          </div>`;
      }).join('');
  }
  document.getElementById('drawerTotal').textContent = money(total);
}

function openDrawer(){
  renderDrawer();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

function buildUI(){
  const tabsEl = document.getElementById('tabs');
  const panelsEl = document.getElementById('panels');
  const catKeys = Object.keys(MENU);

  catKeys.forEach((key, idx) => {
    const cat = MENU[key];
    const tab = document.createElement('div');
    tab.className = 'tab' + (idx === 0 ? ' active' : '');
    tab.textContent = cat.icon + ' ' + cat.label;
    tab.onclick = () => selectTab(key);
    tab.id = 'tab-' + key;
    tabsEl.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'panel' + (idx === 0 ? ' active' : '');
    panel.id = 'panel-' + key;
    panel.innerHTML = `<div class="panel-title">${cat.icon} ${cat.label}</div>` +
      cat.items.map(item => `
        <div class="card">
          <div class="card-icon">${item.icon}</div>
          <div class="card-body">
            <p class="card-name">${item.name}</p>
            <p class="card-desc">${item.desc}</p>
            ${item.note ? `<div class="note">${item.note}</div>` : ''}
            <div class="card-footer">
              <div class="price">${money(item.price)}</div>
              <div id="stepper-${item.id}"></div>
            </div>
          </div>
        </div>
      `).join('');
    panelsEl.appendChild(panel);
  });

  catKeys.forEach(key => MENU[key].items.forEach(item => renderStepper(item.id)));
}

function selectTab(key){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + key).classList.add('active');
  document.getElementById('panel-' + key).classList.add('active');
}

document.getElementById('cartBar').onclick = openDrawer;
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('overlay').onclick = closeDrawer;
document.getElementById('checkoutBtn').onclick = () => {
  const { count } = cartTotals();
  if(count === 0) return;
  showToast("¡Pedido confirmado! 🎉 Te contactaremos al 0978650037");
  closeDrawer();
};

buildUI();
renderCartBar();
</script>
</body>
</html>
