<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smash Point — Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smash_point_menu.css">

</head>
<body>
<div class="app">

  <header>
    <div class="stars"><span></span><span></span><span></span></div>
    <h1 class="logo">Smash Point</h1>
    <div class="tagline">Hamburguesas smash, hot dogs y más — Av 24 con calle 13</div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main id="panels"></main>

  <div class="info">
    📞 Pedidos para llevar: <b>0978650037</b><br>
    🕔 Lunes a domingo: <b>5:00 pm – 12:00 am</b><br>
    📍 <b>Av 24 con calle 13</b>
  </div>
</div>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-left">
    <div class="cart-bubble">🛒</div>
    <div>
      <div class="cart-count" id="cartCount">0 productos</div>
      <div class="cart-total" id="cartTotal">$0.00</div>
    </div>
  </div>
  <div class="cart-cta">Ver carrito</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <h2>Tu pedido</h2>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-footer">
    <label class="buyer-label" for="buyerName">Nombre del comprador</label>
    <input class="buyer-input" id="buyerName" type="text" autocomplete="name" placeholder="Escribe tu nombre">
    <div class="drawer-summary-row">
      <span>Subtotal</span>
      <span id="drawerSubtotal">$0.00</span>
    </div>
    <div class="drawer-summary-row">
      <span>IVA (15%)</span>
      <span id="drawerTax">$0.00</span>
    </div>
    <div class="drawer-total-row">
      <span>Total</span>
      <span id="drawerTotal">$0.00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">Enviar pedido por WhatsApp</button>
  </div>
</div>

<div class="toast" id="toast">Agregado al carrito ✅</div>

<script src="smash_point_menu.js"></script>
</body>
</html>
