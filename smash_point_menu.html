<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smash Point — Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="smash_point_menu.css">
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="top-header">
    <button class="header-btn" id="menuBtn" aria-label="Menú">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
      <img class="brand-logo" id="brandLogo" src="assets/mascota smash point.png" alt="Smash Point">
      <span class="brand-name" id="brandName">Smash Point</span>
    </div>
  </header>

  <!-- Category pills -->
  <nav class="cat-bar" id="catBar"></nav>

  <!-- Views -->
  <main class="main-content">

    <!-- Home view -->
    <div class="view view-home active" id="viewHome">
      <section class="section">
        <h2 class="section-title">Lo más recomendado</h2>
        <div class="rec-grid" id="recGrid"></div>
      </section>
      <section class="section">
        <h2 class="section-title">Lo más Popular</h2>
        <div class="popular-list" id="popularList"></div>
      </section>
      <div class="info-block" id="infoBlock"></div>
    </div>

    <!-- Category view -->
    <div class="view view-category" id="viewCategory">
      <h2 class="cat-heading" id="catHeading"></h2>
      <div class="product-grid" id="productGrid"></div>
    </div>

  </main>

  <!-- Side drawer menu -->
  <div class="side-overlay" id="sideOverlay"></div>
  <aside class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <img class="side-logo" id="sideLogo" src="assets/mascota smash point.png" alt="">
      <button class="side-close" id="sideClose">✕</button>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-info" id="sideInfo"></div>
  </aside>

</div>

<!-- Bottom navigation -->
<nav class="bottom-nav">
  <button class="nav-item active" data-nav="home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>Home</span>
  </button>
  <div class="nav-fab-wrap">
    <button class="nav-fab" id="navFab" aria-label="Carrito">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span class="fab-badge" id="fabBadge">0</span>
    </button>
  </div>
</nav>

<!-- Product detail modal -->
<div class="modal-overlay" id="modalOverlay"></div>
<div class="product-modal" id="productModal">
  <button class="modal-close" id="modalClose">✕</button>
  <div class="modal-image-wrap">
    <img class="modal-image" id="modalImage" src="" alt="">
  </div>
  <div class="modal-body">
    <h3 class="modal-name" id="modalName"></h3>
    <p class="modal-desc" id="modalDesc"></p>
    <p class="modal-note" id="modalNote"></p>
    <div class="modal-footer">
      <span class="modal-price" id="modalPrice"></span>
      <div id="modalStepper"></div>
    </div>
  </div>
</div>

<!-- Cart drawer -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <h2>Tu pedido</h2>
    <button class="drawer-close" id="drawerClose">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-footer">
    <label class="buyer-label" for="buyerName">Nombre del comprador</label>
    <input class="buyer-input" id="buyerName" type="text" autocomplete="name" placeholder="Escribe tu nombre">
    <div class="drawer-summary-row">
      
    </div>
    <div class="drawer-summary-row">
    
    </div>
    <div class="drawer-total-row">
      <span>Total</span>
      <span id="drawerTotal">$0.00</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">Enviar pedido por WhatsApp</button>
  </div>
</div>

<div class="toast" id="toast">Agregado al carrito ✓</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="smash_point_data.js"></script>
<script src="smash_point_menu.js"></script>
<script src="smash_point_whatsapp.js"></script>
</body>
</html>
